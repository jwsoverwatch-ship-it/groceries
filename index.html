<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pantry">
<meta name="theme-color" content="#F7F5F0">
<title>Grocery Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  :root{--paper:#F7F5F0;--ink:#1B1F1C;--muted:#6E7169;--hair:#DDD8CD;--stock:#2E6B52;--red:#B33246}
  html,body{margin:0;padding:0}
  body{font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--paper);
    color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:96px;
    -webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;text-align:left}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:3px}
  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--hair);
    padding:calc(14px + env(safe-area-inset-top)) 16px 0}
  .count{display:flex;align-items:baseline;gap:10px}
  .count b{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .count span{font-size:13.5px;color:var(--muted);font-weight:500;line-height:1.3}
  .tabs{display:flex;gap:20px;margin-top:14px}
  .tab{padding:0 0 10px;font-size:15px;font-weight:600;color:var(--muted);
    border-bottom:3px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--ink);border-bottom-color:var(--ink)}
  main{padding:4px 16px 20px;max-width:640px;margin:0 auto}
  .warn{margin:12px 0 0;padding:10px 12px;border:1px solid var(--hair);border-left:3px solid var(--red);
    background:#fff;font-size:12.5px;line-height:1.45;color:var(--muted);border-radius:0 6px 6px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0 6px;align-items:center}
  .pill{font-size:13px;font-weight:600;padding:7px 13px;border:1px solid var(--hair);border-radius:999px;background:#fff}
  .pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .search{flex:1;min-width:150px;padding:9px 12px;font:inherit;font-size:14px;border:1px solid var(--hair);
    border-radius:999px;background:#fff;color:var(--ink)}
  .rrow{display:flex;gap:13px;align-items:flex-start;width:100%;padding:14px 0;border-bottom:1px solid var(--hair)}
  .swatch{flex:0 0 auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
    margin-top:2px;border:2px solid;transition:background 120ms ease}
  .rname{font-size:16px;font-weight:700;line-height:1.25;letter-spacing:-.01em;display:block}
  .rsrc{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35;display:block}
  .gap{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4;padding-left:11px;
    border-left:2px solid var(--hair);display:block}
  h2{font-size:12.5px;font-weight:700;letter-spacing:.02em;padding:22px 0 8px;margin:0;
    display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  h2 em{font-style:normal;font-weight:500;color:var(--muted);white-space:nowrap}
  h2 button{font-size:12px;font-weight:600;color:var(--muted);text-decoration:underline;
    text-underline-offset:3px;white-space:nowrap}
  .row{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--hair)}
  .tap{display:flex;gap:11px;align-items:flex-start;flex:1;min-width:0}
  .box{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);
    display:grid;place-items:center;margin-top:1px;transition:background 120ms ease}
  .box.sq{border-radius:7px;border-color:var(--stock)}
  .name{font-size:15.5px;font-weight:650;line-height:1.3;letter-spacing:-.005em;display:block}
  .qty{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.4;display:block}
  .note{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.4;font-style:italic;display:block}
  .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
  .tg{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:#fff;padding:2.5px 6px;border-radius:4px}
  .stash{flex:0 0 auto;align-self:center;font-size:11.5px;font-weight:700;padding:6px 9px;
    border:1px solid var(--hair);border-radius:7px;background:#fff;color:var(--muted);line-height:1.1;text-align:center}
  .stash.on{background:var(--stock);border-color:var(--stock);color:#fff}
  .done .name,.done .qty{text-decoration:line-through;opacity:.4}
  .done .tags,.done .note{opacity:.35}
  .instock .name,.instock .qty,.instock .tags,.instock .note{opacity:.45}
  footer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);
    border-top:1px solid var(--hair);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex;justify-content:center}
  footer>div{display:flex;gap:8px;width:100%;max-width:640px;align-items:center}
  .btn{flex:1;padding:13px 12px;border-radius:10px;font-size:14.5px;font-weight:700;
    background:var(--ink);color:var(--paper);text-align:center}
  .btn.ghost{background:none;color:var(--muted);border:1px solid var(--hair);flex:0 0 auto;padding:13px 14px;font-size:13px}
  .btn.danger{background:var(--red);color:#fff}
  .btn.off{opacity:.35}
  .empty{padding:56px 0;text-align:center}
  .empty p{font-size:16px;font-weight:600;margin:0 0 6px}
  .empty small{color:var(--muted);font-size:13.5px}
  textarea{width:100%;height:120px;margin-top:10px;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px;padding:10px;border:1px solid var(--hair);border-radius:8px;background:#fff;color:var(--ink)}
  .status{font-size:11.5px;color:var(--muted);padding:18px 0 0;text-align:center;line-height:1.5}
  .backup{margin-top:26px;padding-top:18px;border-top:1px solid var(--hair)}
  .backup h3{font-size:13px;font-weight:700;margin:0 0 4px}
  .backup p{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}
  .fld{width:100%;padding:9px 12px;font:inherit;font-size:14px;border:1px solid var(--hair);
    border-radius:8px;background:#fff;color:var(--ink);margin-bottom:10px}
  .lbl{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
  .sel{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--hair);border-radius:7px;
    background:#fff;color:var(--ink);max-width:100%}
  .raw{font-size:12.5px;color:var(--muted);line-height:1.4;display:block;margin-bottom:5px}
  .ok{color:var(--stock);font-weight:700}
  .maybe{color:#9a6b12;font-weight:700}
  .new{color:#2F6BB0;font-weight:700}
  .grp{font-size:12.5px;font-weight:700;padding:20px 0 6px;margin:0}
  .step{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--hair)}
  .num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);
    font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
  .stxt{font-size:14.5px;line-height:1.5}
  .stt{font-size:13px;font-weight:700;display:block;margin-bottom:3px}
  .meta{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0 0}
  .chip{font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--hair);
    border-radius:999px;padding:4px 10px;background:#fff}
  .steps-btn{flex:0 0 auto;align-self:center;font-size:11.5px;font-weight:700;padding:6px 9px;
    border:1px solid var(--hair);border-radius:7px;background:#fff;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

var ITEMS = RAW.map(function(r){
  return {id:r[0],section:r[1],name:r[2],total:r[3],
    parts:r[4].map(function(p){return {tag:p[0],qty:p[1]};}),
    note:r[5]||null, optional:!!r[6]};
});
var VALID = {};

/* The 16 recipes and 104 items above are the built-in base. Anything imported
   lives in S.custom and is merged on top at runtime, so the base stays a clean
   constant and a bad import is always reversible. */
var BASE_RECIPES = RECIPES, BASE_ITEMS = ITEMS;
var ALL_ITEM_IDS = {};                      // items whose parts should cover every recipe
BASE_ITEMS.forEach(function(i){ if(i.parts.length === BASE_RECIPES.length) ALL_ITEM_IDS[i.id]=1; });

function rebuild(){
  RECIPES = BASE_RECIPES.concat(S.custom.recipes || []);
  BY_TAG = {}; RECIPES.forEach(function(r){ BY_TAG[r.tag] = r; });

  ITEMS = BASE_ITEMS.map(function(i){
    return {id:i.id, section:i.section, name:i.name, total:i.total,
            parts:i.parts.slice(), note:i.note, optional:i.optional};
  }).concat((S.custom.items || []).map(function(r){
    return {id:r.id, section:r.section, name:r.name, total:r.total,
            parts:(r.parts||[]).map(function(p){return {tag:p[0],qty:p[1]};}),
            note:r.note||null, optional:false, added:true};
  }));

  var byId = {}; ITEMS.forEach(function(i){ byId[i.id] = i; });
  (S.custom.parts || []).forEach(function(p){
    var it = byId[p.item];
    if(it && !it.parts.some(function(x){return x.tag===p.tag;})) it.parts.push({tag:p.tag, qty:p.qty});
  });
  // Salt and black pepper apply to everything, imports included.
  ITEMS.forEach(function(i){
    if(!ALL_ITEM_IDS[i.id]) return;
    i.parts = RECIPES.map(function(r){ return {tag:r.tag, qty:null}; });
  });

  VALID = {}; ITEMS.forEach(function(i){ VALID[i.id]=true; });
}

var KEY = "grocery-planner";
var S = {selected:[],pantry:[],cart:[],tab:"recipes",hidePantry:true,filter:"",confirm:false,backup:null,
         custom:{recipes:[],items:[],parts:[],steps:{}}, workerUrl:"", viewTag:"", imp:null};

function load(){

      var o = JSON.parse(raw);
      S.selected = (o.selected||[]).filter(function(t){return !!BY_TAG[t];});
      S.pantry   = (o.pantry||[]).filter(function(i){return VALID[i];});
      S.cart     = (o.cart||[]).filter(function(i){return VALID[i];});

      if(o.custom) S.custom = normCustom(o.custom);
      if(o.workerUrl) S.workerUrl = o.workerUrl;
      rebuild();

      S.pantry   = S.pantry.filter(function(i){return VALID[i];});
      S.cart     = S.cart.filter(function(i){return VALID[i];});
    }
    status = "ready";
  }catch(e){ status = "off"; }
}
/* synchronous — finishes inside the tap handler, so closing the app can't interrupt it */
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(
      {selected:S.selected,pantry:S.pantry,cart:S.cart,hidePantry:S.hidePantry,
       custom:S.custom,workerUrl:S.workerUrl}));

/* ================= GIST SYNC (shares Crate's token + gist) ================= */
var GIST_FILE="grocery_data.json";
var SYNC={ready:false,state:"idle",err:"",at:null,timer:null,pending:false};

/* Crate stores its config under localStorage key "crate_<k>", JSON-encoded. */
function crateGet(k,fb){try{var v=localStorage.getItem("crate_"+k);return v?JSON.parse(v):fb}catch(e){return fb}}
function ownGet(k,fb){try{var v=localStorage.getItem("groc_"+k);return v?JSON.parse(v):fb}catch(e){return fb}}
function ownSet(k,v){try{localStorage.setItem("groc_"+k,JSON.stringify(v))}catch(e){}}
function cfg(){
  var t=ownGet("gh-token","")||crateGet("gh-token","");
  var g=ownGet("gh-gist-id","")||crateGet("gh-gist-id","");
  return{token:t,gistId:g,borrowed:!ownGet("gh-token","")&&!!crateGet("gh-token","")};
}
function connected(){var c=cfg();return!!(c.token&&c.gistId)}

async function gistPull(){
  var c=cfg();
  if(!c.token||!c.gistId)throw new Error("No token or gist ID");
  var res=await fetch("https://api.github.com/gists/"+c.gistId,
    {headers:{"Authorization":"token "+c.token,"Accept":"application/vnd.github.v3+json"}});
  if(!res.ok)throw new Error("GitHub "+res.status+" "+res.statusText);
  var data=await res.json();
  var f=data&&data.files&&data.files[GIST_FILE];
  if(!f)return null;                                  // first run: file not created yet
  var text;
  if(!f.truncated&&f.content){text=f.content}          // inline content, no extra fetch
  else{                                                // raw_url must be fetched WITHOUT auth
    var r=await fetch(f.raw_url);
    if(!r.ok)throw new Error("Raw fetch "+r.status);
    text=await r.text();
  }
  return JSON.parse(text);
}

async function gistPush(keepalive){
  var c=cfg();
  if(!c.token||!c.gistId||!SYNC.ready)return;
  var files={};
  files[GIST_FILE]={content:JSON.stringify({pantry:S.pantry,selected:S.selected,
    custom:S.custom,workerUrl:S.workerUrl,updatedAt:new Date().toISOString()})};
  var res=await fetch("https://api.github.com/gists/"+c.gistId,{
    method:"PATCH",keepalive:!!keepalive,
    headers:{"Authorization":"token "+c.token,"Accept":"application/vnd.github.v3+json","Content-Type":"application/json"},
    body:JSON.stringify({files:files})});
  if(!res.ok)throw new Error("GitHub "+res.status);
  SYNC.pending=false;SYNC.state="synced";SYNC.at=new Date();SYNC.err="";
}

/* Debounced so a burst of taps is one API call. localStorage already holds the
   truth locally, so a dropped push only means the other device is briefly stale. */
function queuePush(){
  if(!connected()||!SYNC.ready)return;
  SYNC.pending=true;SYNC.state="syncing";
  if(SYNC.timer)clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(function(){
    SYNC.timer=null;
    gistPush(false).then(render).catch(function(e){SYNC.state="error";SYNC.err=e.message;render()});
  },1500);
}
function flushPush(){
  if(!SYNC.pending)return;
  if(SYNC.timer){clearTimeout(SYNC.timer);SYNC.timer=null}
  gistPush(true).catch(function(){});
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")flushPush()});
window.addEventListener("pagehide",flushPush);

/* Pull on load. Newer updatedAt wins; a remote with no pantry never clobbers a local one. */
function syncOnLoad(){
  if(!connected())return;
  SYNC.state="syncing";render();
  gistPull().then(function(remote){
    if(remote){
      var mine=ownGet("updatedAt","");
      var theirs=remote.updatedAt||"";
      var rc=remote.custom||{};
      var remoteHasData=(remote.pantry||[]).length>0||(rc.recipes||[]).length>0;
      if(theirs>mine&&remoteHasData){
        if(remote.custom) S.custom=normCustom(remote.custom);
        if(remote.workerUrl) S.workerUrl=remote.workerUrl;
        rebuild();
        S.pantry=(remote.pantry||[]).filter(function(i){return VALID[i]});
        S.selected=(remote.selected||[]).filter(function(t){return!!BY_TAG[t]});
        ownSet("updatedAt",theirs);
        save();
      }
    }
    SYNC.ready=true;SYNC.state="synced";SYNC.at=new Date();render();
  }).catch(function(e){
    SYNC.ready=false;SYNC.state="error";SYNC.err=e.message;render();
  });
}

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){

function toggle(a,v){ var i=a.indexOf(v); if(i===-1) a.push(v); else a.splice(i,1); }
var TICK = '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true">'+

/* Per-recipe amounts, never summed. Falls back to the combined total only
   when the source didn't say how much each recipe needs. */
function buildList(){
  var out = [];
  ITEMS.forEach(function(it){
    var active = it.parts.filter(function(p){ return has(S.selected,p.tag); });
    if(!active.length) return;
    var known = active.every(function(p){ return !!p.qty; });
    var qty, partial = false;
    if(!known){ qty = it.total; partial = true; }
    else if(active.length === 1){ qty = active[0].qty; }
    else { qty = active.map(function(p){ return p.qty+" ("+p.tag+")"; }).join("  +  "); }
    out.push({id:it.id,section:it.section,name:it.name,note:it.note,optional:it.optional,
      qty:qty, tags:active.map(function(p){return p.tag;}), partial:partial});
  });
  return out;
}
function group(items){
  var m = {};
  items.forEach(function(it){ (m[it.section] = m[it.section]||[]).push(it); });
  return SECTIONS.filter(function(s){ return m[s]; }).map(function(s){ return [s, m[s]]; });

/* ================= IMPORT: parse + match =================
   Two deterministic passes. First split each ingredient string into
   qty / name / prep-note. Then score the name against the 104 items.
   The matcher's job is to fail loudly, not to be clever — anything it
   isn't confident about surfaces in the review screen instead of being
   quietly folded into the wrong ingredient. */

function normCustom(c){
  return {recipes:c.recipes||[], items:c.items||[], parts:c.parts||[], steps:c.steps||{}};
}

var UNITS = {cup:"cup",cups:"cup",c:"cup",tablespoon:"tbsp",tablespoons:"tbsp",tbsp:"tbsp",tbsps:"tbsp",
  tbs:"tbsp",teaspoon:"tsp",teaspoons:"tsp",tsp:"tsp",tsps:"tsp",ounce:"oz",ounces:"oz",oz:"oz",
  pound:"lb",pounds:"lb",lb:"lb",lbs:"lb",gram:"g",grams:"g",g:"g",kilogram:"kg",kg:"kg",
  milliliter:"ml",milliliters:"ml",ml:"ml",liter:"l",liters:"l",litre:"l",clove:"clove",cloves:"clove",
  can:"can",cans:"can",jar:"jar",jars:"jar",bunch:"bunch",bunches:"bunch",head:"head",heads:"head",
  pinch:"pinch",pinches:"pinch",slice:"slice",slices:"slice",sprig:"sprig",sprigs:"sprig",
  stalk:"stalk",stalks:"stalk",package:"package",packages:"package",pkg:"package",
  quart:"quart",quarts:"quart",pint:"pint",pints:"pint",dash:"dash",dashes:"dash",stick:"stick",sticks:"stick"};

/* Stripped from both sides before scoring, so "boneless, skinless chicken
   thighs" and the item "Boneless skinless chicken thighs or breast" reduce
   to the same thing. */
var NOISE = {};
("fresh freshly large small medium chopped minced ground grated sliced diced roughly finely thinly "+
 "trimmed boneless skinless peeled deveined optional divided plus more for serving taste room "+
 "temperature softened melted packed drained rinsed cooked uncooked whole halved quartered shredded "+
 "cubed crushed pressed juiced zested seeded stemmed of or and the a an about approximately good "+
 "quality best any choice preferably such as needed extra virgin").split(" ").forEach(function(w){ NOISE[w]=1; });

var ALIAS = {yoghurt:"yogurt",broth:"stock",garbanzo:"chickpea",aubergine:"eggplant",
  courgette:"zucchini",capsicum:"pepper",chilli:"chili",chile:"chili",passata:"tomato",
  parmigiano:"parmesan",reggiano:"parmesan",tamari:"soy",canola:"neutral",vegetable:"neutral",
  confectioner:"powdered",coriander:"coriander",scallion:"scallion",courge:"squash"};

/* Whole-name shortcuts. Cheaper and far more reliable than teaching the
   scorer that broth is stock and kosher salt is salt. */
var EXPLICIT = {
  "green onion":"scallions","green onions":"scallions","scallion":"scallions","scallions":"scallions",
  "chicken broth":"chicken-stock","chicken stock":"chicken-stock",
  "kosher salt":"salt","sea salt":"salt","table salt":"salt","fine salt":"salt",
  "black pepper":"black-pepper","freshly ground black pepper":"black-pepper","ground black pepper":"black-pepper",
  "extra virgin olive oil":"olive-oil","evoo":"olive-oil",
  "greek yogurt":"yoghurt","greek yoghurt":"yoghurt","plain yogurt":"yoghurt",
  "coriander leaves":"cilantro","fresh coriander":"cilantro","cilantro leaves":"cilantro",
  "vegetable oil":"neutral-oil","canola oil":"neutral-oil","grapeseed oil":"neutral-oil",
  "white sugar":"sugar","granulated sugar":"sugar","caster sugar":"sugar",
  "corn starch":"cornstarch","corn flour":"cornstarch",
  "all purpose flour":"flour","plain flour":"flour","ap flour":"flour",
  "long grain rice":"basmati","jasmine rice":"jasmine-rice",
  "unsalted butter":"butter","salted butter":"butter",
  "low sodium soy sauce":"soy-sauce","light soy sauce":"soy-sauce","soy sauce":"soy-sauce",
  "mayo":"mayo","mayonnaise":"mayo","japanese mayo":"mayo",
  "scallion greens":"scallions","spring onion":"scallions",
  "chilli flakes":"red-pepper-flakes","red chili flakes":"red-pepper-flakes",
  "crushed red pepper":"red-pepper-flakes","pul biber":"red-pepper-flakes",
  "toasted sesame oil":"sesame-oil","sesame oil":"sesame-oil",
  "rice vinegar":"rice-vinegar","rice wine vinegar":"rice-vinegar",
  "tomato paste":"tomato-paste","double concentrated tomato paste":"tomato-paste",
  "panko":"panko","panko bread crumbs":"panko","bread crumbs":"panko"
};

/* Opposite sides of one of these is a different ingredient, however much
   of the name they share. This is the silken-vs-extra-firm guard. */
var CONFLICTS = [["fresh","dried"],["silken","firm"],["ground","whole"],["salted","unsalted"],
                 ["smoked","sweet"],["light","dark"],["raw","cooked"],["sweet","hot"]];

var FRAC = "\u00bc\u00bd\u00be\u2153\u2154\u215b\u215c\u215d\u215e";
var PREP = new RegExp("^(chopped|minced|diced|sliced|grated|shredded|peeled|trimmed|cut|divided|"+
  "softened|melted|drained|rinsed|pressed|cubed|crushed|halved|quartered|julienned|zested|juiced|"+
  "seeded|stemmed|deveined|thinly|finely|roughly|freshly|lightly|well|room|packed|plus|for|to|at|"+
  "optional|or|about|preferably|rough|torn|beaten|whisked|toasted|warmed|thawed|frozen|washed)\\b","i");

function singular(w){
  if(w.length < 4) return w;
  if(/ies$/.test(w)) return w.slice(0,-3)+"y";
  if(/oes$/.test(w)) return w.slice(0,-2);
  if(/(ch|sh|s|x|z)es$/.test(w)) return w.slice(0,-2);
  if(/ss$/.test(w)) return w;
  if(/s$/.test(w)) return w.slice(0,-1);
  return w;
}

function toks(s, keepNoise){
  var raw = String(s).toLowerCase().replace(/[^a-z0-9\s-]/g," ").replace(/-/g," ").split(/\s+/);
  var out = [], seen = {};
  raw.forEach(function(w){
    if(!w) return;
    w = ALIAS[w] || w; w = singular(w); w = ALIAS[w] || w;
    if(!keepNoise && NOISE[w]) return;
    if(!seen[w]){ seen[w] = 1; out.push(w); }
  });
  return out;
}

function normName(s){
  return String(s).toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}

function parseLine(raw){
  var s = String(raw).replace(/\s+/g," ").trim();
  var out = {raw:s, qty:"", name:s, note:""};
  var num = "(?:\\d+(?:\\.\\d+)?(?:\\s*\\/\\s*\\d+)?|["+FRAC+"])";
  var m = s.match(new RegExp("^("+num+"(?:\\s*(?:to|-|\\u2013)\\s*"+num+")?(?:\\s+"+num+")?)\\s*"));
  var rest = s;
  if(m){ out.qty = m[1].replace(/\s+/g," ").trim(); rest = s.slice(m[0].length); }

  var w = rest.match(/^([A-Za-z]+)\.?\s+/);
  if(w && UNITS[w[1].toLowerCase()]){
    out.qty = (out.qty ? out.qty + " " : "") + UNITS[w[1].toLowerCase()];
    rest = rest.slice(w[0].length);
  }

  /* Only treat a comma as the name/prep boundary when prep language follows.
     Otherwise "boneless, skinless chicken thighs" gets cut in half. */
  var idx = -1, p = 0, c;
  while((c = rest.indexOf(",", p)) !== -1){
    if(PREP.test(rest.slice(c+1).trim())){ idx = c; break; }
    p = c + 1;
  }
  if(idx !== -1){
    out.name = rest.slice(0, idx).trim();
    out.note = rest.slice(idx+1).trim();
  } else {
    var f = rest.match(/\s+(for\s+\w+|to\s+taste|plus\s+more.*|divided|optional)\s*$/i);
    if(f){ out.note = f[1].trim(); rest = rest.slice(0, rest.length - f[0].length); }
    out.name = rest.trim();
  }
  out.name = out.name.replace(/\s*\(([^)]*)\)\s*/g, function(_, inner){
    out.note = out.note ? out.note + "; " + inner : inner; return " ";
  }).replace(/\s+/g," ").replace(/^(of|or)\s+/i,"").trim();
  return out;
}

function scoreMatch(item, lineName){
  var a = toks(item.name), b = toks(lineName);
  if(!a.length || !b.length) return 0;
  var shared = a.filter(function(t){ return b.indexOf(t) !== -1; });
  if(!shared.length) return 0;

  var s, ah = a[a.length-1], bh = b[b.length-1];
  if(b.indexOf(ah) === -1 && a.indexOf(bh) === -1){
    s = 0.2 * shared.length / a.length;              // shares words but not the head noun
  } else {
    var missA = a.filter(function(t){ return b.indexOf(t) === -1; }).length;
    var missB = b.filter(function(t){ return a.indexOf(t) === -1; }).length;
    s = 1 - 0.3*missA - 0.2*missB;
  }
  var ra = toks(item.name, true), rb = toks(lineName, true);
  CONFLICTS.forEach(function(pair){
    var ia = pair.filter(function(x){ return ra.indexOf(x) !== -1; }).join();
    var ib = pair.filter(function(x){ return rb.indexOf(x) !== -1; }).join();
    if(ia && ib && ia !== ib) s -= 0.5;
  });
  return Math.max(0, Math.min(1, s));
}

function bestMatches(name){
  var key = normName(name);
  if(EXPLICIT[key] && VALID[EXPLICIT[key]]) return [{id:EXPLICIT[key], score:1}];
  return ITEMS.map(function(i){ return {id:i.id, score:scoreMatch(i, name)}; })
    .filter(function(x){ return x.score > 0.15; })
    .sort(function(x,y){ return y.score - x.score; })
    .slice(0, 6);
}

var SECT_HINTS = [
  [/\b(oil|ghee|shortening)\b/, "Oils"],

  [/\b(chicken|beef|pork|lamb|shrimp|fish|salmon|tofu|tempeh|egg|milk|butter|cheese|yogurt|yoghurt|cream|mayo|mayonnaise|bacon|sausage|parmesan|feta|buttermilk|miso)\b/, "Protein & refrigerated"],
  [/\b(lettuce|tomato|onion|garlic|ginger|cilantro|parsley|dill|lemon|lime|orange|cucumber|cabbage|broccoli|cauliflower|chive|scallion|shallot|mint|potato|carrot|celery|apple|avocado|mushroom|bell pepper|chili|serrano|jalapeno|herb|spinach|kale|zucchini|squash)\b/, "Produce"],
  [/\b(parchment|foil|skewer|toothpick|bag)\b/, "Non-food"]
];
function guessSection(name){
  var n = normName(name);
  for(var i=0;i<SECT_HINTS.length;i++) if(SECT_HINTS[i][0].test(n)) return SECT_HINTS[i][1];
  return "Produce";
}

function slug(s){
  return normName(s).replace(/\s+/g,"-").slice(0,40) || "item";
}
function titleCase(s){
  s = String(s).trim();
  return s ? s[0].toUpperCase() + s.slice(1) : s;
}

var PALETTE = ["#7C2D4A","#A65A2E","#46707A","#6D3B8E","#2F6BB0","#B33246","#3E7D3A","#8A5A2B",
               "#C25E12","#17788C","#B03A86","#6E7B1F","#4B4FA6","#2E8B6E","#A8860B","#7A46A0"];
function nextColor(){
  var used = {}; RECIPES.forEach(function(r){ used[r.color] = 1; });
  for(var i=0;i<PALETTE.length;i++) if(!used[PALETTE[i]]) return PALETTE[i];
  return PALETTE[RECIPES.length % PALETTE.length];
}
function uniqueTag(name){
  var w = String(name).replace(/[^A-Za-z\s]/g," ").split(/\s+/).filter(Boolean);
  var c = [];
  if(w.length > 1) c.push((w[0][0]+w[1][0]).toUpperCase());
  if(w.length > 2) c.push((w[0][0]+w[2][0]).toUpperCase());
  if(w[0] && w[0].length > 1) c.push(w[0].slice(0,2).toUpperCase());
  for(var i=0;i<c.length;i++) if(!BY_TAG[c[i]]) return c[i];
  var A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(var x=0;x<26;x++) for(var y=0;y<26;y++) if(!BY_TAG[A[x]+A[y]]) return A[x]+A[y];
  return "Z" + RECIPES.length;
}

function buildRow(line){
  var p = parseLine(line);
  var m = bestMatches(p.name);
  var top = m[0];
  return {raw:p.raw, qty:p.qty, name:p.name, note:p.note,
          res:(top && top.score >= 0.55) ? top.id : "__new__",
          score:(top ? top.score : 0), section:guessSection(p.name), options:m};
}

/* Without a scheme the browser reads this as a relative path and fetches
   your own site, which answers with an HTML 404 page. */
var DEFAULT_WORKER = "https://tiny-disk-0921.jwsoverwatch.workers.dev";

function workerBase(){
  var u = (S.workerUrl||"").trim().replace(/\/+$/,"") || DEFAULT_WORKER;
  if(!/^https?:\/\//i.test(u)) u = "https://" + u;
  return u;
}

/* Same JSON-LD extraction the Worker does, running locally on pasted page
   source. No proxy involved, so sites that fingerprint datacenter traffic
   can't refuse it. */
function xStr(v){
  if(v == null) return "";
  if(typeof v === "string") return v.trim();
  if(typeof v === "number") return String(v);
  if(Array.isArray(v)) return xStr(v[0]);
  if(typeof v === "object") return xStr(v["@value"] != null ? v["@value"] : (v.value != null ? v.value : v.name));
  return String(v);
}
function xArr(v){ return Array.isArray(v) ? v : (v == null ? [] : [v]); }
function xClean(v){
  return xStr(v).replace(/<[^>]*>/g," ").replace(/&nbsp;/gi," ").replace(/&amp;/gi,"&")
    .replace(/&quot;/gi,'"').replace(/&#0?39;|&apos;/gi,"'")
    .replace(/&#(\d+);/g,function(_,d){ return String.fromCharCode(+d); })
    .replace(/\s+/g," ").trim();
}
function xUrl(v){
  if(!v) return "";
  if(typeof v === "string") return v;
  if(Array.isArray(v)) return xUrl(v[0]);
  return xStr(v.url) || xStr(v.contentUrl) || "";
}
function xAuthor(v){
  if(!v) return "";
  var a = Array.isArray(v) ? v[0] : v;
  return typeof a === "string" ? xClean(a) : xClean(a && a.name);
}
function xType(n){
  var t = n && n["@type"], list = Array.isArray(t) ? t : [t];
  for(var i=0;i<list.length;i++) if(typeof list[i] === "string")
    return list[i].toLowerCase().replace(/^https?:\/\/schema\.org\//,"");
  return "";
}
function xWalk(n, d){
  if(!n || typeof n !== "object" || d > 6) return null;
  if(Array.isArray(n)){
    for(var i=0;i<n.length;i++){ var h = xWalk(n[i], d+1); if(h) return h; }
    return null;
  }
  if(xType(n) === "recipe") return n;
  var keys = ["@graph","mainEntity","mainEntityOfPage","itemListElement"];
  for(var k=0;k<keys.length;k++) if(n[keys[k]]){
    var g = xWalk(n[keys[k]], d+1); if(g) return g;
  }
  return null;
}
function xFind(html){
  var re = /<script[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi, m;
  while((m = re.exec(html))){
    var parsed;
    try{ parsed = JSON.parse(m[1].trim()); }catch(e){ continue; }
    var hit = xWalk(parsed, 0);
    if(hit) return hit;
  }
  return null;
}
function xSplit(s){
  var t = String(s);
  if(/<\s*(li|p|br|div|h[1-6])\b/i.test(t))
    t = t.replace(/<\s*(li|p|div|h[1-6])[^>]*>/gi,"\n").replace(/<\s*br\s*\/?\s*>/gi,"\n");
  return t.split(/\n+/).map(xClean)
    .map(function(x){ return x.replace(/^(?:step\s*)?\d+\s*[.):]\s+/i,""); })
    .filter(function(x){ return x.length > 2; });
}
function xCollect(n, out, d){
  if(n == null || d > 5) return;
  if(Array.isArray(n)){ n.forEach(function(k){ xCollect(k, out, d+1); }); return; }
  if(typeof n === "string"){
    xSplit(n).forEach(function(t){ out.push({title:"", text:t, image:""}); }); return;
  }
  if(typeof n !== "object") return;
  if(xType(n) === "howtosection"){ xCollect(n.itemListElement || n.steps, out, d+1); return; }
  var text = xClean(n.text), title = xClean(n.name), img = xUrl(n.image);
  if(text) out.push({title:(title && title !== text) ? title : "", text:text, image:img});
  else if(n.itemListElement) xCollect(n.itemListElement, out, d+1);
  else if(title) out.push({title:"", text:title, image:img});
}
var X_SECT = /^(for the [^:]{1,40}|for serving|to serve|to assemble|to finish|assembly|make ahead)\s*:\s*/i;
function xSections(groups){
  if(groups.length !== 1 || groups[0].name) return groups;
  var steps = groups[0].steps;
  if(steps.filter(function(s){ return X_SECT.test(s.text); }).length < 2) return groups;
  var out = [], cur = null;
  steps.forEach(function(s){
    var m = s.text.match(X_SECT);
    if(m){ cur = {name:m[1].trim(), steps:[]}; out.push(cur);
      s = {title:s.title, text:s.text.slice(m[0].length).trim(), image:s.image}; }
    if(!cur){ cur = {name:"", steps:[]}; out.push(cur); }
    if(s.text) cur.steps.push(s);
  });
  return out.filter(function(g){ return g.steps.length; });
}
function xInstructions(v){
  var groups = [], open = null;
  function loose(){ if(!open){ open = {name:"", steps:[]}; groups.push(open); } return open.steps; }
  (function scan(n, d){
    if(n == null || d > 5) return;
    if(Array.isArray(n)){ n.forEach(function(k){ scan(k, d+1); }); return; }
    if(typeof n === "string"){ xCollect(n, loose(), 0); return; }
    if(typeof n !== "object") return;
    if(xType(n) === "howtosection"){
      var st = []; xCollect(n.itemListElement || n.steps || n.text, st, 0);
      if(st.length){ groups.push({name:xClean(n.name), steps:st}); open = null; }
      return;
    }
    xCollect(n, loose(), 0);
  })(v, 0);
  return xSections(groups.filter(function(g){ return g.steps.length; }));
}
function xDur(v){
  var s = xStr(v); if(!s) return null;
  var m = s.match(/^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?$/i), mins;
  if(m) mins = (+m[1]||0)*1440 + (+m[2]||0)*60 + (+m[3]||0) + Math.round((+m[4]||0)/60);
  else {
    var hh = /(\d+)\s*(?:h|hour)/i.exec(s), mm = /(\d+)\s*(?:m|min)/i.exec(s);
    mins = (hh ? +hh[1]*60 : 0) + (mm ? +mm[1] : 0);
  }
  if(!mins) return null;
  var h = Math.floor(mins/60), r = mins%60;
  return {minutes:mins, text: h ? (r ? h+" hr "+r+" min" : h+" hr") : mins+" min"};
}
function xRating(v){
  if(!v) return null;
  var a = Array.isArray(v) ? v[0] : v, val = parseFloat(xStr(a && a.ratingValue));
  if(!val) return null;
  return {value:val, count: parseInt(xStr(a.ratingCount || a.reviewCount), 10) || 0};
}
function xDedupe(l){
  var seen = {}, out = [];
  l.forEach(function(x){ var k = x.toLowerCase(); if(!seen[k]){ seen[k]=1; out.push(x); } });
  return out;
}
function extractRecipe(html, sourceUrl){
  var r = xFind(html);
  if(!r) return null;
  var groups = xInstructions(r.recipeInstructions), host = "";
  try{ host = new URL(sourceUrl).hostname; }catch(e){}
  return {
    name: xClean(r.name) || host || "Imported recipe",
    description: xClean(r.description), image: xUrl(r.image), author: xAuthor(r.author),
    source: sourceUrl || "", yield: xClean(r.recipeYield),
    times: {prep:xDur(r.prepTime), cook:xDur(r.cookTime), total:xDur(r.totalTime)},
    rating: xRating(r.aggregateRating),
    ingredients: xDedupe(xArr(r.recipeIngredient).map(xClean).filter(Boolean)),
    instructions: groups,
    stepCount: groups.reduce(function(n,g){ return n + g.steps.length; }, 0)
  };
}

function parsePaste(){
  var html = (S.imp && S.imp.html) || "";
  if(html.trim().length < 200){
    S.imp = {url:(S.imp&&S.imp.url)||"", paste:true, html:html,
             err:"Paste the whole page source, not a fragment", loading:false};
    render(); return;
  }
  var d;
  try{ d = extractRecipe(html, (S.imp && S.imp.url) || ""); }
  catch(e){ d = null; }
  if(!d || !d.ingredients.length){
    S.imp = {url:(S.imp&&S.imp.url)||"", paste:true, html:html, loading:false,
      err:"No schema.org/Recipe markup in that page source. The site may not publish it."};
    render(); return;
  }
  S.imp = {url:(S.imp&&S.imp.url)||"", paste:true, html:"", loading:false, err:"",
           data:d, rows:d.ingredients.map(buildRow)};
  render();
}

function runImport(){
  var wu = workerBase();
  var ru = ((S.imp && S.imp.url) || "").trim();
  if(!wu || !ru){ S.imp = {url:ru, err:"Both URLs are needed", loading:false}; render(); return; }
  if(!/^https?:\/\//i.test(ru)){
    S.imp = {url:ru, err:"The recipe URL needs to start with https://", loading:false};
    render(); return;
  }
  S.workerUrl = wu; ownSet("worker", wu);
  S.imp = {url:ru, loading:true, err:"", data:null, rows:null};
  render();
  fetch(wu + "/?url=" + encodeURIComponent(ru))
    .then(function(r){ return r.text().then(function(t){
      var j;
      try { j = JSON.parse(t); }
      catch(e){
        throw new Error(/^\s*</.test(t)
          ? "Got a web page back instead of JSON \u2014 check the Worker URL"
          : "Worker returned " + r.status + " and not JSON");
      }
      if(!r.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; }); })
    .then(function(d){
      if(!d.ingredients || !d.ingredients.length) throw new Error("No ingredients came back");
      S.imp = {url:ru, loading:false, err:"", data:d, rows:d.ingredients.map(buildRow)};
      render();
    })
    .catch(function(e){
      S.imp = {url:ru, loading:false, err:e.message||"Fetch failed", data:null, rows:null};
      render();
    });
}

function commitImport(){
  var d = S.imp && S.imp.data; if(!d) return;
  var tag = uniqueTag(d.name), host = "";
  try{ host = new URL(d.source).hostname.replace(/^www\./,""); }catch(e){}
  S.custom.recipes.push({tag:tag, name:d.name, color:nextColor(), gap:"",
    source:host + (d.yield ? " \u00b7 " + d.yield + " servings" : ""),
    url:d.source, image:d.image||"", times:d.times||null,
    rating:d.rating||null, yield:d.yield||"", added:new Date().toISOString()});
  if(d.instructions && d.instructions.length) S.custom.steps[tag] = d.instructions;

  S.imp.rows.forEach(function(r){
    if(r.res === "__skip__") return;
    var qty = r.qty || r.note || "as needed";
    if(r.res === "__new__"){
      var base = "u-" + slug(r.name), id = base, n = 2;
      while(VALID[id] || S.custom.items.some(function(x){ return x.id === id; })) id = base + "-" + (n++);
      S.custom.items.push({id:id, section:r.section, name:titleCase(r.name),
                           total:qty, parts:[[tag, qty]], note:r.note||null});
    } else {
      S.custom.parts.push({item:r.res, tag:tag, qty:qty});
    }
  });

  rebuild();
  if(!has(S.selected, tag)) S.selected.push(tag);
  S.imp = null; S.tab = "recipes"; S.viewTag = tag;
  save(); render();
}

function dropRecipe(tag){
  S.custom.recipes = S.custom.recipes.filter(function(r){ return r.tag !== tag; });
  S.custom.parts   = S.custom.parts.filter(function(p){ return p.tag !== tag; });
  S.custom.items   = S.custom.items.filter(function(i){
    return !(i.parts || []).every(function(p){ return p[0] === tag; });
  });
  delete S.custom.steps[tag];
  S.selected = S.selected.filter(function(t){ return t !== tag; });
  rebuild();
  S.tab = "recipes"; S.viewTag = "";
  save();
}

/* ================= RENDER ================= */
function render(){
  var list = buildList(), grouped = group(list);
  var toBuy = list.filter(function(it){ return !has(S.pantry,it.id) && !has(S.cart,it.id); });
  var haveCount = list.filter(function(it){ return has(S.pantry,it.id); }).length;

  var big, cap;
  if(S.tab === "recipes"){ big = S.selected.length;
    cap = (S.selected.length===1?"recipe":"recipes")+" picked \u00b7 "+list.length+" ingredients"; }
  else if(S.tab === "pantry"){ big = S.pantry.length;
    cap = "of "+ITEMS.length+" ingredients marked as in stock"; }
  else if(S.tab === "import"){ big = (S.imp && S.imp.rows) ? S.imp.rows.length : 0;
    cap = (S.imp && S.imp.rows) ? "ingredients found \u00b7 review before adding" : "paste a recipe URL below"; }
  else if(S.tab === "steps"){ var sg = S.custom.steps[S.viewTag] || [];
    big = sg.reduce(function(n,g){ return n + g.steps.length; }, 0);
    cap = "steps \u00b7 " + (BY_TAG[S.viewTag] ? BY_TAG[S.viewTag].name : ""); }
  else { big = toBuy.length;
    cap = "left to buy \u00b7 "+S.cart.length+" in the cart"+(haveCount?" \u00b7 "+haveCount+" from the pantry":""); }

  var h = '<header><div class="count"><b>'+big+'</b><span>'+cap+'</span></div><div class="tabs">'+
    [["recipes","Recipes"],["list","List"],["pantry","Pantry"],["sync","Sync"]].map(function(t){
      return '<button class="tab'+(S.tab===t[0]?" on":"")+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>';
    }).join("")+'</div></header><main>';

  if(status === "off") h += '<div class="warn">This browser is blocking storage, so nothing will be '+
    'remembered. Turn off Private Browsing, or keep the backup code at the bottom of the Pantry tab.</div>';

  if(S.tab === "recipes"){
    h += '<div class="bar"><button class="pill" data-act="all-recipes">Pick all '+RECIPES.length+
      '</button><button class="pill" data-act="no-recipes">Clear picks</button>'+
      '<button class="pill" data-act="tab" data-v="import">+ Import from URL</button></div>';
    RECIPES.forEach(function(r){
      var on = has(S.selected, r.tag), steps = S.custom.steps[r.tag];
      h += '<div class="rrow">'+
        '<button class="tap" data-act="recipe" data-v="'+r.tag+'">'+
        '<span class="swatch" style="border-color:'+r.color+';background:'+(on?r.color:"transparent")+'">'+
        (on?tick():"")+'</span><span style="flex:1;min-width:0">'+
        '<span class="rname">'+esc(r.name)+'</span><span class="rsrc">'+esc(r.source)+'</span>'+
        (r.gap?'<span class="gap">'+esc(r.gap)+'</span>':"")+'</span></button>'+
        (steps ? '<button class="steps-btn" data-act="steps" data-v="'+r.tag+'">Steps</button>' : "")+
        '</div>';
    });
  }

  /* ---------------- IMPORT ---------------- */
  if(S.tab === "import"){
    var I = S.imp || {};
    h += '<div style="padding:16px 0 0">'+
      '<label class="lbl">Worker URL</label>'+
      '<input class="fld" id="wurl" placeholder="https://something.workers.dev" value="'+esc(S.workerUrl)+'">'+
      '<label class="lbl">Recipe URL</label>'+
      '<input class="fld" id="rurl" placeholder="https://…" value="'+esc(I.url||"")+'">'+
      '<button class="pill" data-act="run-import">'+(I.loading?"Fetching…":"Fetch recipe")+'</button>'+
      '<button class="pill" data-act="toggle-paste" style="margin-left:6px">'+
        (I.paste?"Use the fetcher":"Blocked? Paste source")+'</button></div>';

    if(I.err) h += '<div class="warn">'+esc(I.err)+'</div>';

    if(I.paste && !I.rows){
      h += '<p style="font-size:13px;color:var(--muted);line-height:1.5;margin:14px 0 0">'+
        'On a computer: open the recipe, press Ctrl+U (Cmd+Option+U on a Mac) to see the page '+
        'source, select all, copy, and paste it below. Nothing leaves your browser — the '+
        'same extraction runs locally.</p>'+
        '<textarea id="phtml" style="height:150px" placeholder="Paste the full page source here">'+
        esc(I.html||"")+'</textarea>'+
        '<div class="bar"><button class="pill" data-act="parse-paste">Read pasted source</button></div>';
    }

    if(I.rows){
      var d = I.data, t = d.times || {};
      h += '<h2 class="gp-sec" style="padding-top:22px">'+esc(d.name)+'</h2>';
      var chips = [];
      if(t.prep) chips.push("Prep " + t.prep.text);
      if(t.cook) chips.push("Cook " + t.cook.text);
      if(t.total) chips.push("Total " + t.total.text);
      if(d.yield) chips.push(d.yield + " servings");
      if(d.stepCount) chips.push(d.stepCount + " steps");
      if(d.rating) chips.push("★ " + d.rating.value);
      if(chips.length) h += '<div class="meta">'+chips.map(function(c){
        return '<span class="chip">'+esc(c)+'</span>'; }).join("")+'</div>';

      var nOk = I.rows.filter(function(r){ return r.res !== "__new__" && r.res !== "__skip__"; }).length;

          '<span class="raw">'+esc(r.raw)+'</span>'+

              '<option value="__skip__"'+(isSkip?" selected":"")+'>Skip this line</option>'+
            '</optgroup>'+
            '<optgroup label="All ingredients">'+allOpts.map(function(o){
              return '<option value="'+o.id+'"'+(o.id===r.res?" selected":"")+'>'+esc(o.name)+'</option>';
            }).join("")+'</optgroup>'+
          '</select>'+
          (isNew ? '<select class="sel" data-sect="'+i+'" style="margin-left:6px">'+
            SECTIONS.map(function(s){
              return '<option value="'+esc(s)+'"'+(s===r.section?" selected":"")+'>'+esc(s)+'</option>';
            }).join("")+'</select>' : "")+

  }

  /* ---------------- STEPS ---------------- */
  if(S.tab === "steps"){
    var rec = BY_TAG[S.viewTag], groups = S.custom.steps[S.viewTag];
    if(!rec || !groups){

        'instructions.</small></div>';
    } else {
      var tt = rec.times || {}, ch = [];
      if(tt.prep) ch.push("Prep " + tt.prep.text);
      if(tt.cook) ch.push("Cook " + tt.cook.text);
      if(tt.total) ch.push("Total " + tt.total.text);
      if(rec.yield) ch.push(rec.yield + " servings");
      h += '<h2 class="gp-sec" style="padding-top:20px;display:block">'+esc(rec.name)+'</h2>';
      if(ch.length) h += '<div class="meta">'+ch.map(function(c){
        return '<span class="chip">'+esc(c)+'</span>'; }).join("")+'</div>';
      var n = 0;
      groups.forEach(function(g){
        if(g.name) h += '<h3 class="grp">'+esc(g.name)+'</h3>';
        g.steps.forEach(function(s){
          n++;
          h += '<div class="step"><span class="num">'+n+'</span><span class="stxt">'+
            (s.title ? '<span class="stt">'+esc(s.title)+'</span>' : "")+
            esc(s.text)+'</span></div>';
        });
      });
      if(rec.url) h += '<div class="meta"><a class="chip" href="'+esc(rec.url)+
        '" target="_blank" rel="noreferrer">Original recipe</a></div>';
      h += '<div class="bar" style="padding-top:20px">'+
        (S.confirm ? '<button class="pill" data-act="drop-recipe" data-v="'+S.viewTag+
            '" style="border-color:var(--red);color:var(--red)">Yes, remove this recipe</button>'+
            '<button class="pill" data-act="unconfirm">Keep it</button>'
          : '<button class="pill" data-act="confirm">Remove this recipe</button>')+'</div>';
    }
  }

  if(S.tab === "list"){
    if(!list.length){
      h += '<div class="empty"><p>Nothing to buy yet</p><small>Pick a few recipes and the list '+
        'builds itself.</small><div style="margin-top:18px">'+
        '<button class="pill" data-act="tab" data-v="recipes">Go pick recipes</button></div></div>';
    } else {
      h += '<div class="bar"><button class="pill'+(S.hidePantry?" on":"")+'" data-act="hide">'+
        (S.hidePantry?("Hiding "+haveCount+" pantry items"):"Showing pantry items")+'</button>'+
        (S.cart.length?'<button class="pill" data-act="empty-cart">Empty cart</button>':"")+'</div>';
      grouped.forEach(function(g){
        var section = g[0], items = g[1];
        var vis = S.hidePantry ? items.filter(function(it){ return !has(S.pantry,it.id); }) : items;
        if(!vis.length) return;
        var left = items.filter(function(it){ return !has(S.pantry,it.id) && !has(S.cart,it.id); }).length;
        vis = vis.slice().sort(function(a,b){ return (has(S.pantry,a.id)?1:0)-(has(S.pantry,b.id)?1:0); });
        h += '<h2>'+esc(section)+'<em>'+left+' to buy</em></h2>';
        vis.forEach(function(it){
          var done = has(S.cart,it.id), have = has(S.pantry,it.id);
          h += '<div class="row'+(done?" done":"")+(have?" instock":"")+'">'+
            '<button class="tap" data-act="'+(have?"noop":"cart")+'" data-v="'+it.id+'">'+
            '<span class="box" style="background:'+(done?"var(--ink)":"transparent")+';visibility:'+
            (have?"hidden":"visible")+'">'+(done?tick("#F7F5F0"):"")+'</span>'+
            '<span style="flex:1;min-width:0"><span class="name">'+esc(it.name)+
            (it.optional?" (optional)":"")+'</span><span class="qty">'+
            (have ? "In stock" : (it.partial ? "up to "+esc(it.qty)+" \u2014 split by recipe not given"
              : esc(it.qty)))+'</span>'+
            (!have && it.note ? '<span class="note">'+esc(it.note)+'</span>' : "")+
            tagChips(it.tags)+'</span></button>'+
            '<button class="stash'+(have?" on":"")+'" data-act="stock" data-v="'+it.id+'">'+
            (have?"In stock":"Have it")+'</button></div>';
        });
      });
      h += '<div class="status">'+statusLine()+'</div>';
    }
  }

  if(S.tab === "pantry"){
    h += '<div class="bar"><input class="search" id="q" value="'+esc(S.filter)+
      '" placeholder="Find an ingredient">'+
      (S.filter?'<button class="pill" data-act="clear-filter">Clear</button>':"")+'</div>'+
      '<p style="font-size:13px;color:var(--muted);line-height:1.5;margin:2px 0 0">Mark what\'s already '+
      'in your kitchen. These stay marked between visits and drop out of every list until you unmark them.</p>';
    var q = S.filter.trim().toLowerCase();
    var pool = q ? ITEMS.filter(function(i){ return i.name.toLowerCase().indexOf(q) !== -1; }) : ITEMS;
    if(!pool.length) h += '<div class="empty"><p>No match</p><small>Try a shorter word.</small></div>';
    group(pool).forEach(function(g){
      var section = g[0], items = g[1];
      var allOn = items.every(function(it){ return has(S.pantry,it.id); });
      h += '<h2>'+esc(section)+'<button data-act="mark-section" data-v="'+esc(section)+'">'+
        (allOn?"Unmark all":"Mark all")+'</button></h2>';
      items.forEach(function(it){
        var have = has(S.pantry,it.id);
        h += '<div class="row"><button class="tap" data-act="stock" data-v="'+it.id+'">'+
          '<span class="box sq" style="background:'+(have?"var(--stock)":"transparent")+'">'+
          (have?tick():"")+'</span><span style="flex:1;min-width:0">'+
          '<span class="name">'+esc(it.name)+'</span><span class="qty">Used in '+
          (it.parts.length===RECIPES.length ? "every recipe"
            : it.parts.map(function(p){return p.tag;}).join(", "))+
          '</span></span></button></div>';
      });
    });
    h += '<div class="backup"><h3>Backup code</h3><p>Paste this into a note. If the pantry ever comes '+
      'back empty, paste it back here and tap Restore.</p><textarea id="bk" placeholder="Your pantry is '+
      'empty \u2014 mark some items first.">'+esc(S.backup===null ? S.pantry.join(" ") : S.backup)+
      '</textarea><div style="display:flex;gap:8px">'+
      '<button class="pill" data-act="restore">Restore from this code</button></div></div>'+
      '<div class="status">'+statusLine()+'</div>';
  }

  if(S.tab === "sync"){
    var c=cfg();
    var line = SYNC.state==="syncing"?"Syncing\u2026"
      : SYNC.state==="error"?("Error: "+SYNC.err)
      : SYNC.at?("Synced "+SYNC.at.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}))
      : connected()?"Connected, not synced yet":"Not connected";
    var dot = SYNC.state==="error"?"var(--red)":SYNC.state==="syncing"?"#c8922e":connected()?"var(--stock)":"var(--muted)";

    h += '<div style="display:flex;align-items:center;gap:8px;padding:16px 0 4px">'+
      '<span style="width:10px;height:10px;border-radius:50%;background:'+dot+';flex:0 0 auto"></span>'+
      '<span style="font-size:14px;font-weight:600">'+esc(line)+'</span></div>';

    if(connected()){
      h += '<p style="font-size:13px;color:var(--muted);line-height:1.55;margin:8px 0 0">Your pantry and '+
        'recipe picks live in <code style="font-size:12px">'+GIST_FILE+'</code> inside gist <code style="font-size:12px">'+
        esc(c.gistId.slice(0,10))+'\u2026</code>'+(c.borrowed?', using the token Crate already saved on this device':'')+
        '. Crate\u2019s own file in that gist is never touched. The cart stays on this device \u2014 a half-checked '+
        'basket on your phone has no business showing up on your desktop.</p>'+
        '<div class="bar"><button class="pill" data-act="gh-push">Push now</button>'+
        '<button class="pill" data-act="gh-pull">Pull now</button>'+
        '<button class="pill" data-act="gh-forget">Disconnect</button></div>';
    } else {
      h += '<p style="font-size:13px;color:var(--muted);line-height:1.55;margin:8px 0 0">No credentials found. '+
        'If Crate is hosted on this same origin and you\u2019ve connected it here, they\u2019d be picked up '+
        'automatically \u2014 otherwise paste them below. The token needs only the <code style="font-size:12px">gist</code> scope.</p>'+
        '<div style="margin-top:14px"><label style="font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px">GitHub token</label>'+
        '<input class="search" id="ght" type="password" placeholder="ghp_\u2026" style="width:100%;flex:none" value="'+esc(ownGet("gh-token",""))+'">'+
        '<label style="font-size:12px;font-weight:600;color:var(--muted);display:block;margin:12px 0 4px">Gist ID</label>'+
        '<input class="search" id="ghg" placeholder="the id from your Crate gist URL" style="width:100%;flex:none" value="'+esc(ownGet("gh-gist-id",""))+'">'+
        '<div class="bar"><button class="pill" data-act="gh-connect">Connect</button></div></div>';
    }
    h += '<div class="status">'+statusLine()+'</div>';
  }

  h += '</main><footer><div>';
  if(S.tab === "recipes")
    h += '<button class="btn'+(S.selected.length?"":" off")+'" data-act="tab" data-v="list">'+
      (S.selected.length ? "Build list ("+toBuy.length+" to buy)" : "Pick a recipe to start")+'</button>';
  if(S.tab === "list")
    h += '<button class="btn'+(toBuy.length?"":" off")+'" data-act="copy">'+
      (copied ? "Copied" : "Copy what\u2019s left ("+toBuy.length+")")+'</button>';
  if(S.tab === "pantry"){
    h += S.confirm
      ? '<button class="btn danger" data-act="wipe">Yes, empty the pantry</button>'+
        '<button class="btn ghost" data-act="unconfirm">Keep it</button>'
      : '<button class="btn" data-act="tab" data-v="list">See the list</button>'+
        '<button class="btn ghost'+(S.pantry.length?"":" off")+'" data-act="confirm">Empty pantry</button>';
  }
  if(S.tab === "sync")
    h += '<button class="btn" data-act="tab" data-v="list">Back to the list</button>';
  if(S.tab === "import")
    h += (S.imp && S.imp.rows
      ? '<button class="btn" data-act="commit-import">Add to my recipes</button>'+
        '<button class="btn ghost" data-act="cancel-import">Cancel</button>'
      : '<button class="btn" data-act="tab" data-v="recipes">Back to recipes</button>');
  if(S.tab === "steps")
    h += '<button class="btn" data-act="tab" data-v="recipes">Back to recipes</button>';
  if(S.tab !== "pantry" && S.tab !== "sync" && S.tab !== "import" && S.tab !== "steps")
    h += '<button class="btn ghost" data-act="tab" data-v="pantry">Pantry'+
      (S.pantry.length?" ("+S.pantry.length+")":"")+'</button>';
  h += '</div></footer>';

  document.getElementById("app").innerHTML = h;

  var q1 = document.getElementById("q");
  if(q1){
    q1.addEventListener("input", function(){ S.filter = q1.value; render(); });
    if(S.filter){ q1.focus(); try{ q1.setSelectionRange(q1.value.length, q1.value.length); }catch(e){} }
  }
  var wu = document.getElementById("wurl");
  if(wu) wu.addEventListener("input", function(){ S.workerUrl = wu.value; ownSet("worker", wu.value); });
  var ph = document.getElementById("phtml");
  if(ph) ph.addEventListener("input", function(){ S.imp = S.imp || {}; S.imp.html = ph.value; });
  var ru = document.getElementById("rurl");
  if(ru) ru.addEventListener("input", function(){
    S.imp = S.imp || {}; S.imp.url = ru.value; });
  ["ght","ghg"].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener("input",function(){el.setAttribute("value",el.value)});
  });
  var bk = document.getElementById("bk");
  if(bk) bk.addEventListener("input", function(){ S.backup = bk.value; });
}

/* ================= EVENTS ================= */
function listText(){
  var list = buildList();
  var haveCount = list.filter(function(it){ return has(S.pantry,it.id); }).length;
  var out = ["Grocery list \u2014 "+S.selected.map(function(t){return BY_TAG[t].name;}).join(", ")];
  if(haveCount) out.push("("+haveCount+" more already in the pantry)");
  out.push("");
  group(list).forEach(function(g){
    var rows = g[1].filter(function(it){ return !has(S.pantry,it.id) && !has(S.cart,it.id); });
    if(!rows.length) return;
    out.push(g[0].toUpperCase());
    rows.forEach(function(it){ out.push("- "+it.name+" \u2014 "+it.qty+" ["+it.tags.join(" ")+"]"); });
    out.push("");
  });
  return out.join("\n").trim();
}

document.getElementById("app").addEventListener("change", function(ev){
  var el = ev.target;
  if(!S.imp || !S.imp.rows) return;
  if(el.hasAttribute("data-row")){
    var r = S.imp.rows[+el.getAttribute("data-row")];
    if(r){ r.res = el.value; render(); }
  } else if(el.hasAttribute("data-sect")){
    var r2 = S.imp.rows[+el.getAttribute("data-sect")];
    if(r2) r2.section = el.value;          // no re-render; keeps the select open
  }
});

document.getElementById("app").addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act]");
  if(!el) return;
  var act = el.getAttribute("data-act"), v = el.getAttribute("data-v");
  var dirty = true;

  if(act === "noop" || act === "clear-filter"){ if(act==="clear-filter") S.filter=""; dirty=false; }
  else if(act === "tab"){
    S.tab = v; S.confirm = false; copied = false; dirty = false;
    if(v === "import" && !S.imp) S.imp = {url:"", loading:false, err:"", data:null, rows:null};
    if(v === "import" && !S.workerUrl) S.workerUrl = ownGet("worker","") || DEFAULT_WORKER;
  }
  else if(act === "recipe") toggle(S.selected, v);
  else if(act === "all-recipes") S.selected = RECIPES.map(function(r){ return r.tag; });
  else if(act === "no-recipes") S.selected = [];
  else if(act === "cart") toggle(S.cart, v);
  else if(act === "stock"){
    toggle(S.pantry, v);
    var ci = S.cart.indexOf(v); if(ci !== -1) S.cart.splice(ci,1);
    S.backup = null;
  }
  else if(act === "hide") S.hidePantry = !S.hidePantry;
  else if(act === "empty-cart") S.cart = [];
  else if(act === "mark-section"){
    var ids = ITEMS.filter(function(i){ return i.section === v; }).map(function(i){ return i.id; });
    var allOn = ids.every(function(id){ return has(S.pantry,id); });
    S.pantry = allOn ? S.pantry.filter(function(p){ return ids.indexOf(p) === -1; })
      : S.pantry.concat(ids.filter(function(id){ return !has(S.pantry,id); }));
    S.backup = null;
  }
  else if(act === "confirm"){ if(!S.pantry.length) return; S.confirm = true; dirty = false; }
  else if(act === "unconfirm"){ S.confirm = false; dirty = false; }
  else if(act === "wipe"){ S.pantry = []; S.confirm = false; S.backup = null; }
  else if(act === "restore"){
    var ids2 = (S.backup === null ? "" : S.backup).split(/[\s,]+/)
      .map(function(s){ return s.trim(); }).filter(function(s){ return VALID[s]; });
    S.pantry = ids2.filter(function(x,i){ return ids2.indexOf(x) === i; });
    S.backup = null;
  }
  else if(act === "gh-connect"){
    var t=(document.getElementById("ght")||{}).value||"";
    var g=(document.getElementById("ghg")||{}).value||"";
    if(!t.trim()||!g.trim()){SYNC.state="error";SYNC.err="Both fields are required";render();return}
    ownSet("gh-token",t.trim());ownSet("gh-gist-id",g.trim());
    SYNC.ready=false;syncOnLoad();return;
  }
  else if(act === "gh-pull"){
    SYNC.state="syncing";render();
    gistPull().then(function(r){
      if(r&&(r.pantry||[]).length){
        S.pantry=(r.pantry||[]).filter(function(i){return VALID[i]});
        S.selected=(r.selected||[]).filter(function(x){return!!BY_TAG[x]});
        ownSet("updatedAt",r.updatedAt||new Date().toISOString());
        SYNC.ready=true;save();
      } else { SYNC.err="Nothing stored in the gist yet";SYNC.state="error";render();return }
      SYNC.state="synced";SYNC.at=new Date();render();
    }).catch(function(e){SYNC.state="error";SYNC.err=e.message;render()});
    return;
  }
  else if(act === "gh-push"){
    SYNC.ready=true;SYNC.state="syncing";render();
    gistPush(false).then(render).catch(function(e){SYNC.state="error";SYNC.err=e.message;render()});
    return;
  }
  else if(act === "gh-forget"){
    ownSet("gh-token","");ownSet("gh-gist-id","");
    SYNC.ready=false;SYNC.state="idle";SYNC.at=null;SYNC.err="";render();return;
  }
  else if(act === "run-import"){ runImport(); return; }
  else if(act === "toggle-paste"){
    S.imp = S.imp || {};
    S.imp = {url:S.imp.url||"", paste:!S.imp.paste, html:S.imp.html||"", err:"",
             loading:false, data:null, rows:null};
    dirty = false;
  }
  else if(act === "parse-paste"){ parsePaste(); return; }
  else if(act === "commit-import"){ commitImport(); return; }
  else if(act === "cancel-import"){ S.imp = null; S.tab = "recipes"; dirty = false; }
  else if(act === "steps"){ S.tab = "steps"; S.viewTag = v; S.confirm = false; dirty = false; }
  else if(act === "drop-recipe"){ dropRecipe(v); render(); return; }
  else if(act === "copy"){
    var txt = listText();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        copied = true; render(); setTimeout(function(){ copied = false; render(); }, 1800);
      }).catch(function(){ window.prompt("Copy this list:", txt); });
    } else { window.prompt("Copy this list:", txt); }
    return;
  }

  if(dirty) save();
  render();
});

if(!S.workerUrl) S.workerUrl = ownGet("worker","") || DEFAULT_WORKER;
load();
rebuild();
render();
syncOnLoad();
</script>
</body>
</html>
